# Alembic configuration for the SPEMCS backend.
#
# Run every alembic command from the `backend/` directory, the same working directory the test
# suite requires:
#
#     cd backend
#     python -m alembic current
#     python -m alembic upgrade head
#
# There is deliberately NO sqlalchemy.url here. The database URL carries live credentials, and
# alembic.ini is a tracked file - so migrations/env.py reads it from `backend.app.config.settings`
# (i.e. from DATABASE_URL in the untracked .env) at run time instead. Setting sqlalchemy.url in
# this file would commit a credential; leaving it empty is what keeps that from happening.

[alembic]
script_location = backend/migrations
prepend_sys_path = .
version_path_separator = os

# Revision filenames get a numeric prefix so `ls versions/` is in dependency order.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
