<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" style="background:#0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Title -->
  <rect x="0" y="0" width="1280" height="60" fill="#161b22" />
  <text x="30" y="38" fill="#58a6ff" font-size="22" font-weight="700">SPEMCS Production Deployment Topology</text>
  <text x="530" y="38" fill="#8b949e" font-size="14">Linux Server Infrastructure + Windows Lab Client Provisioning</text>
  <rect x="1130" y="18" width="120" height="26" rx="13" fill="#238636" />
  <text x="1145" y="35" fill="#ffffff" font-size="11" font-weight="600">VERIFIED CODE</text>

  <!-- INFRASTRUCTURE TIER: LINUX MANAGEMENT SERVER -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="580" height="680" rx="10" fill="#161b22" stroke="#388bfd" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="580" height="40" rx="10" fill="#1f6feb" />
    <text x="20" y="26" fill="#ffffff" font-size="15" font-weight="700">Linux Server Infrastructure (Debian / Ubuntu 22.04 LTS)</text>

    <!-- Nginx Proxy -->
    <rect x="20" y="55" width="540" height="110" rx="6" fill="#0d1117" stroke="#30363d" />
    <text x="35" y="78" fill="#58a6ff" font-size="13" font-weight="700">1. Edge Reverse Proxy: Nginx (Port 443 / 80)</text>
    <text x="35" y="96" fill="#8b949e" font-size="11">• TLS Termination: Let's Encrypt / Institutional Wildcard Cert</text>
    <text x="35" y="112" fill="#8b949e" font-size="11">• WebSocket Proxying: proxy_set_header Upgrade $http_upgrade</text>
    <text x="35" y="128" fill="#8b949e" font-size="11">• Static SPA Assets: serves frontend Vite production build (/dist)</text>
    <text x="35" y="144" fill="#7ee787" font-size="10">Routes /api/* and /api/v1/ws/* to internal Uvicorn socket</text>

    <!-- Uvicorn / Systemd -->
    <rect x="20" y="180" width="540" height="160" rx="6" fill="#0d1117" stroke="#388bfd" />
    <text x="35" y="202" fill="#58a6ff" font-size="13" font-weight="700">2. Application Daemon: Systemd + Uvicorn ASGI</text>
    <text x="35" y="222" fill="#8b949e" font-size="11">• Service Unit: /etc/systemd/system/spemcs-backend.service</text>
    <text x="35" y="238" fill="#8b949e" font-size="11">• Command: uvicorn backend.app.main:app --host 127.0.0.1 --port 8002</text>
    <text x="35" y="254" fill="#8b949e" font-size="11">• EnvironmentFile: /etc/spemcs/backend.env (Strict permissions: 0600)</text>
    <text x="35" y="270" fill="#8b949e" font-size="11">• SPEMCS_ENV=production enforces secret validation on startup</text>
    <text x="35" y="286" fill="#7ee787" font-size="10">Keyring Directory: /var/lib/spemcs/secrets/ (RSA-PSS signing key)</text>
    <text x="35" y="302" fill="#7ee787" font-size="10">Worker Pool: 4 ASGI workers behind connection multiplexer</text>

    <!-- PostgreSQL -->
    <rect x="20" y="355" width="540" height="145" rx="6" fill="#0d1117" stroke="#f0883e" />
    <text x="35" y="377" fill="#f0883e" font-size="13" font-weight="700">3. Persistence: PostgreSQL 15+ (Local or Neon TLS)</text>
    <text x="35" y="397" fill="#8b949e" font-size="11">• Port: 5432 (TLS required, sslmode=require)</text>
    <text x="35" y="413" fill="#8b949e" font-size="11">• SQLAlchemy connection pool: pool_size=50, max_overflow=20, pool_pre_ping=True</text>
    <text x="35" y="429" fill="#8b949e" font-size="11">• Migrations: alembic upgrade head applied during deploy pipeline</text>
    <text x="35" y="445" fill="#8b949e" font-size="10">Verified schema revisions: 0001_baseline.py, 0002_add_network_enforcement.py</text>
    <text x="35" y="461" fill="#7ee787" font-size="10">Startup verifies foreign keys and admin existence via schema_check.py</text>

    <!-- Operational Runbook Box -->
    <rect x="20" y="515" width="540" height="145" rx="6" fill="#0d1117" stroke="#30363d" />
    <text x="35" y="537" fill="#c9d1d9" font-size="12" font-weight="700">Deployment Commands (Linux):</text>
    <text x="35" y="557" fill="#79c0ff" font-size="10">systemctl daemon-reload &amp;&amp; systemctl restart spemcs-backend</text>
    <text x="35" y="573" fill="#79c0ff" font-size="10">journalctl -u spemcs-backend -f -n 100</text>
    <text x="35" y="591" fill="#8b949e" font-size="10">Health Check: curl -f http://127.0.0.1:8002/health</text>
    <text x="35" y="607" fill="#8b949e" font-size="10">Rotates secrets with zero downtime via secret rotation script</text>
  </g>

  <!-- CLIENT TIER: WINDOWS LAB ENDPOINT WORKSTATION -->
  <g transform="translate(670, 80)">
    <rect x="0" y="0" width="580" height="680" rx="10" fill="#161b22" stroke="#238636" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="580" height="40" rx="10" fill="#238636" />
    <text x="20" y="26" fill="#ffffff" font-size="15" font-weight="700">Windows Lab Endpoint Workstation (Win 10/11 x64)</text>

    <!-- MSI Provisioning -->
    <rect x="20" y="55" width="540" height="110" rx="6" fill="#0d1117" stroke="#30363d" />
    <text x="35" y="78" fill="#3fb950" font-size="13" font-weight="700">1. Client Provisioning: WiX / PowerShell Installer</text>
    <text x="35" y="96" fill="#8b949e" font-size="11">• Script: build-msi.ps1 | install_service.ps1</text>
    <text x="35" y="112" fill="#8b949e" font-size="11">• Binaries deployed to: C:\Program Files\Spemcs\Endpoint Agent</text>
    <text x="35" y="128" fill="#8b949e" font-size="11">• State directory: C:\ProgramData\Spemcs\ (SYSTEM &amp; Admins full control)</text>
    <text x="35" y="144" fill="#7ee787" font-size="10">Durable SQLite store: C:\ProgramData\Spemcs\sqlite_rollback_journal.db</text>

    <!-- Windows Service -->
    <rect x="20" y="180" width="540" height="160" rx="6" fill="#0d1117" stroke="#388bfd" />
    <text x="35" y="202" fill="#58a6ff" font-size="13" font-weight="700">2. Session 0 Service Registration (SCM)</text>
    <text x="35" y="222" fill="#8b949e" font-size="11">• sc.exe create Spemcs.Agent.Service binPath= ... start= auto</text>
    <text x="35" y="238" fill="#8b949e" font-size="11">• sc.exe failure Spemcs.Agent.Service reset= 86400 actions= restart/5000</text>
    <text x="35" y="254" fill="#8b949e" font-size="11">• Runs as: NT AUTHORITY\SYSTEM (Session 0)</text>
    <text x="35" y="270" fill="#8b949e" font-size="11">• Opens Named Pipe Server: \\.\pipe\spemcs-control-v1</text>
    <text x="35" y="286" fill="#7ee787" font-size="10">Controls Windows Firewall COM (HNetCfg.FwPolicy2) and WMI Hooks</text>
    <text x="35" y="302" fill="#7ee787" font-size="10">Starts automatically on lab PC power-up before any user login</text>

    <!-- Interactive Desktop UI Launch -->
    <rect x="20" y="355" width="540" height="145" rx="6" fill="#0d1117" stroke="#238636" />
    <text x="35" y="377" fill="#3fb950" font-size="13" font-weight="700">3. Session 1+ Interactive Desktop Launch</text>
    <text x="35" y="397" fill="#8b949e" font-size="11">• Service calls InteractiveSessionUiLauncher.cs:</text>
    <text x="35" y="413" fill="#8b949e" font-size="11">• Queries WTSGetActiveConsoleSessionId() -> duplicate token via DuplicateTokenEx()</text>
    <text x="35" y="429" fill="#8b949e" font-size="11">• Launches Spemcs.Agent.UI.exe in candidate desktop via CreateProcessAsUserW()</text>
    <text x="35" y="445" fill="#8b949e" font-size="10">UI connects to Service via Named Pipe IPC with student DACL</text>
    <text x="35" y="461" fill="#7ee787" font-size="10">Displays student verification dialog, exam status, and lock overlay</text>

    <!-- Operational Commands Box -->
    <rect x="20" y="515" width="540" height="145" rx="6" fill="#0d1117" stroke="#30363d" />
    <text x="35" y="537" fill="#c9d1d9" font-size="12" font-weight="700">Deployment Commands (Windows Elevated PowerShell):</text>
    <text x="35" y="557" fill="#79c0ff" font-size="10">.\install_service.ps1 -BackendUrl "https://spemcs.univ.edu" -BootstrapKey "..."</text>
    <text x="35" y="573" fill="#79c0ff" font-size="10">Get-Service Spemcs.Agent.Service | Format-List Status, StartType</text>
    <text x="35" y="591" fill="#8b949e" font-size="10">View Service Logs: Get-Content C:\ProgramData\Spemcs\Logs\agent-*.log -Tail 50</text>
    <text x="35" y="607" fill="#8b949e" font-size="10">Inspect SQLite Journal: sqlite3.exe C:\ProgramData\Spemcs\sqlite_rollback_journal.db</text>
  </g>
</svg>
